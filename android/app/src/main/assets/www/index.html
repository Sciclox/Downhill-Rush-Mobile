  <title>Downhill Rush - Extreme Mountain Bike</title>
  <style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif}body,html{color:#fff;touch-action:none;background-color:#0b0f19;width:100%;height:100%;overflow:hidden}#game-container{z-index:1;width:100%;height:100%;position:absolute;top:0;left:0}#hud{z-index:10;pointer-events:none;width:100%;height:100%;padding:env(safe-area-inset-top,16px) env(safe-area-inset-right,16px) env(safe-area-inset-bottom,16px) env(safe-area-inset-left,16px);flex-direction:column;justify-content:space-between;display:flex;position:absolute;top:0;left:0}.top-bar{justify-content:space-between;align-items:center;gap:12px;width:100%;padding:8px 12px;display:flex}.stat-pill{-webkit-backdrop-filter:blur(8px);background:#0f172abf;border:1px solid #ffffff26;border-radius:20px;align-items:center;gap:6px;padding:6px 14px;font-size:14px;font-weight:700;display:flex;box-shadow:0 4px 12px #0000004d}.progress-container{flex-direction:column;flex:1;gap:4px;max-width:280px;display:flex}.progress-track{background:#fff3;border-radius:4px;width:100%;height:8px;overflow:hidden}.progress-fill{background:linear-gradient(90deg,#ff3b00,#fa0);width:0%;height:100%;transition:width .1s linear}.speedometer-box{-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);background:#0f172aa6;border:1px solid #ffffff1a;border-radius:14px;flex-direction:column;align-items:flex-end;padding:8px 14px;display:flex;position:absolute;top:70px;right:20px}.speed-number{letter-spacing:-1px;color:#0fc;text-shadow:0 0 16px #00ffcc80;font-size:38px;font-weight:900;line-height:1}.speed-unit{text-transform:uppercase;letter-spacing:1px;color:#fff9;font-size:11px;font-weight:700}.nitro-bar-wrap{background:#fff3;border-radius:2px;width:70px;height:4px;margin-top:6px;overflow:hidden}.nitro-bar-fill{background:#0fc;width:0%;height:100%;transition:width 50ms linear;box-shadow:0 0 8px #0fc}#alert-banner{text-align:center;text-shadow:0 4px 20px #000c;opacity:0;pointer-events:none;font-size:32px;font-weight:900;transition:all .25s cubic-bezier(.175,.885,.32,1.275);position:absolute;top:40%;left:50%;transform:translate(-50%,-50%)scale(.8)}#alert-banner.visible{opacity:1;transform:translate(-50%,-50%)scale(1.15)}.touch-controls{pointer-events:auto;justify-content:space-between;align-items:flex-end;width:100%;padding-bottom:20px;display:flex}.control-cluster-left,.control-cluster-right{align-items:center;gap:14px;display:flex}.touch-btn{-webkit-backdrop-filter:blur(10px);letter-spacing:.5px;color:#fff;touch-action:none;cursor:pointer;background:#ffffff1f;border:2px solid #ffffff40;border-radius:50%;flex-direction:column;justify-content:center;align-items:center;width:74px;height:74px;font-size:13px;font-weight:800;transition:transform 80ms,background 80ms,border-color 80ms;display:flex;box-shadow:0 8px 24px #00000059}.touch-btn svg{fill:#fff;width:28px;height:28px}.touch-btn.active{background:#ffffff59;border-color:#0fc;transform:scale(.92);box-shadow:0 0 16px #0fc9}.touch-btn.pedal{background:#00d2d340;border-color:#00d2d380;width:84px;height:84px}.touch-btn.pedal.active{background:#00d2d399;border-color:#0fc}.touch-btn.brake{background:#ff475740;border-color:#ff475780}.touch-btn.brake.active{background:#ff475799;border-color:#ff4757}.desktop-hint{color:#ffffff73;pointer-events:none;text-transform:uppercase;letter-spacing:.8px;font-size:11px;position:absolute;bottom:8px;left:50%;transform:translate(-50%)}#finish-overlay{-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);z-index:50;pointer-events:auto;background:#0b0f19d9;flex-direction:column;justify-content:center;align-items:center;gap:16px;width:100%;height:100%;transition:opacity .3s;display:flex;position:absolute;top:0;left:0}#finish-overlay.hidden{display:none}.finish-card{text-align:center;background:#1e293be6;border:1px solid #ffffff26;border-radius:24px;width:90%;max-width:320px;padding:32px 4   <script type="module" crossorigin src="./assets/index-CY3WyScb.js"></script>
</head>
<body>
  <div id="game-container"></div>

  <!-- HUD -->
  <div id="hud">
    <div class="top-bar">
      <div class="stat-pill">
        <span>⭐</span>
        <span id="coins-value">0</span>
      </div>

      <div class="progress-container">
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>

      <div class="stat-pill">
        <span>PTS</span>
        <span id="score-value">0</span>
      </div>
    </div>

    <!-- Speedometer -->
    <div class="speedometer-box">
      <div class="speed-number" id="speed-value">0</div>
      <div class="speed-unit">KM/H</div>
      <div class="nitro-bar-wrap">
        <div id="nitro-fill" class="nitro-bar-fill"></div>
      </div>
    </div>

    <!-- Alert / Wipeout Banner -->
    <div id="alert-banner">WIPEOUT!</div>

    <!-- Touch Controls for Mobile Screens -->
    <div class="touch-controls">
      <!-- Left cluster: Steering -->
      <div class="control-cluster-left">
        <div id="touch-left" class="touch-btn">
          <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </div>
        <div id="touch-right" class="touch-btn">
          <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </div>
      </div>

      <!-- Right cluster: Drive / Brake -->
      <div class="control-cluster-right">
        <div id="touch-brake" class="touch-btn brake">
          <span>FRENO</span>
        </div>
        <div id="touch-pedal" class="touch-btn pedal">
          <span>PEDAL</span>
        </div>
      </div>
    </div>

    <div class="desktop-hint">PC: Flechas / WASD para conducir y pedalear</div>
  </div>

  <!-- Finish Modal -->
  <div id="finish-overlay" class="hidden">
    <div class="finish-card">
      <div class="finish-title">¡META ALCANZADA!</div>
      <p style="color: rgba(255,255,255,0.7); font-size: 14px;">Descenso completado</p>
      <div class="finish-score" id="final-score">0</div>
      <p style="color: #00ffcc; font-weight: 700; font-size: 13px;">PUNTUACIÓN TOTAL</p>
      <button id="btn-restart" class="btn-action">JUGAR DE NUEVO</button>
    </div>
  </div>

</body>
</html>
